name: test + demo

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest -q

  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Runs sdiff on the real bundled stripe/openapi v2440->v2442 example.
      # Exit code 1 (a BREAKING change is present) is the correct, expected
      # result here, not a CI failure - hence continue-on-error. Needs an
      # OPENROUTER_API_KEY repo secret; fails with a clear message without one
      # (e.g. on a fork PR), which is fine since this job never blocks `test`.
      - name: Run sdiff on the bundled real example
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python sdiff.py examples/stripe-v2440.yaml examples/stripe-v2442.yaml --judge chat
        continue-on-error: true
