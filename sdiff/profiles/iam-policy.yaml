name: iam-policy
detect:
  keys: [Statement, PolicyDocument]
  files: ["*policy*.json", "*policy*.yaml", "rbac.yaml", "role.yaml"]
subject: "access policy change"
audience: "security reviewers and everything this policy governs access to"
align_keys: [Sid, name, id, key]
state_note: >-
  old=None means this statement or field did not exist before (a pure
  addition). new=None means it was removed. In this profile BREAKING covers
  BOTH directions of risk: access that stops working, and access that gets
  granted where it shouldn't -- both need a human to look before this ships.
kinds:
  breaking: >-
    Access that used to be denied is now allowed (a wildcard action or
    resource, a new principal, a removed condition, Effect flipped to
    Allow), OR access that used to work now fails (a removed statement,
    a principal or action removed that something depends on). Either
    direction fails the check: this is "do not ship unreviewed."
  behaviour: >-
    Access is unchanged in scope, but how it's expressed or scoped shifts
    in a way worth noticing (a resource ARN pattern changed without
    widening, a condition key changed without loosening it).
  cosmetic: >-
    Statement ID (Sid), description, or comments only; no effect on what
    is allowed or denied.
reasons:
  removed:
    criteria: "The statement, action, resource, or principal was removed entirely (new=None)."
    template: "{path} was removed"
  added_optional:
    criteria: "A new statement was added that narrows or maintains existing access (old=None)."
    template: "{path} was added"
  added_required:
    criteria: "A new statement or principal was added that GRANTS access, e.g. Allow with a new action/resource/principal (old=None)."
    template: "{path} was added, granting new access; review before this ships"
  optional_to_required:
    criteria: "A condition that was optional became mandatory, narrowing access."
    template: "{path} changed optional -> required"
  type_changed:
    criteria: "Effect flipped between Allow and Deny for an EXISTING statement. Not for old=None."
    template: "{path} changed {old} -> {new}"
  enum_narrowed:
    criteria: "The set of allowed actions, resources, or principals shrank (access narrowed)."
    template: "{path} narrowed: {old} -> {new}"
  default_changed:
    criteria: "A default or unspecified value changed without altering scope."
    template: "{path} default changed {old} -> {new}"
  constraint_tightened:
    criteria: "A condition got MORE restrictive for an EXISTING statement (e.g. IP range narrowed, MFA now required). Not for old=None."
    template: "{path} constraint tightened: {old} -> {new}"
  constraint_loosened:
    criteria: "A condition got LESS restrictive, an action/resource became a wildcard, or a principal was widened (e.g. account -> *)."
    template: "{path} constraint loosened: {old} -> {new}"
  doc_only:
    criteria: "Only a Sid, description, or comment changed."
    template: "{path} documentation only, no functional change"
  other:
    criteria: "None of the above describes it well."
    template: "{path} changed {old} -> {new}"
nouls:
  client_code_must_change: "Would anything relying on this policy's access need to change to keep working?"
  old_requests_still_valid: "Would every access allowed under the old policy still be allowed, and nothing more, under the new one?"
  doc_or_example_only: "Is this change limited to Sid, description, or comments, with no effect on what is allowed or denied?"
rules:
  - glob: "*.Sid"
    kind: cosmetic
    reason: doc_only
  - glob: "*.description"
    kind: cosmetic
    reason: doc_only
