    checkout_us_bank_account_payment_method_options:
      description: ''
      properties:
        financial_connections:
          $ref: '#/components/schemas/checkout_financial_connections_payment_method_options'
        setup_future_usage:
          description: 'Indicates that you intend to make future payments with this
            PaymentIntent''s payment method.


            If you provide a Customer with the PaymentIntent, you can use this parameter
            to [attach the payment method](/payments/save-during-payment) to the Customer
            after the PaymentIntent is confirmed and the customer completes any required
            actions. If you don''t provide a Customer, you can still [attach](/api/payment_methods/attach)
            the payment method to a Customer after the transaction completes.


            If the payment method is `card_present` and isn''t a digital wallet, Stripe
            creates and attaches a [generated_card](/api/charges/object#charge_object-payment_method_details-card_present-generated_card)
            payment method representing the card to the Customer instead.


            When processing card payments, Stripe uses `setup_future_usage` to help
            you comply with regional legislation and network rules, such as [SCA](/strong-customer-authentication).'
          enum:
          - none
          - off_session
          - on_session
          type: string
        target_date:
          description: Controls when Stripe will attempt to debit the funds from the
            customer's account. The date must be a string in YYYY-MM-DD format. The
            date must be in the future and between 3 and 15 calendar days from now.
          maxLength: 5000
          type: string
        verification_method:
          description: Bank account verification method. The default value is `automatic`.
          enum:
          - automatic
          - instant
          type: string
          x-stripeBypassValidation: true
      title: CheckoutUsBankAccountPaymentMethodOptions
      type: object
      x-expandableFields:
      - financial_connections
    account_link:
      description: 'Account Links are the means by which a Connect platform grants
        a connected account permission to access

        Stripe-hosted applications, such as Connect Onboarding.


        Related guide: [Connect Onboarding](https://docs.stripe.com/connect/custom/hosted-onboarding)'
      properties:
        created:
          description: Time at which the object was created. Measured in seconds since
            the Unix epoch.
          format: unix-time
          type: integer
        expires_at:
          description: The timestamp at which this account link will expire.
          format: unix-time
          type: integer
        object:
          description: String representing the object's type. Objects of the same
            type share the same value.
          enum:
          - account_link
          type: string
        url:
          description: The URL for the account link.
          maxLength: 5000
          type: string
      required:
      - created
      - expires_at
      - object
      - url
      title: Account Link
      type: object
      x-expandableFields: []
      x-resourceId: account_link
    account_session:
      description: 'An AccountSession allows a Connect platform to grant access to
        a connected account in Connect embedded components.


        We recommend that you create an AccountSession each time you need to display
        an embedded component

        to your user. Do not save AccountSessions to your database as they expire
        relatively

        quickly, and cannot be used more than once.


        Related guide: [Connect embedded components](https://docs.stripe.com/connect/get-started-connect-embedded-components)'
      properties:
        account:
          description: The ID of the account the AccountSession was created for
          maxLength: 5000
          type: string
        client_secret:
          description: 'The client secret of this AccountSession. Used on the client
            to set up secure access to the given `account`.


            The client secret can be used to provide access to `account` from your
            frontend. It should not be stored, logged, or exposed to anyone other
            than the connected account. Make sure that you have TLS enabled on any
            page that includes the client secret.


            Refer to our docs to [setup Connect embedded components](https://docs.stripe.com/connect/get-started-connect-embedded-components)
            and learn about how `client_secret` should be handled.'
          maxLength: 5000
          type: string
        components:
          $ref: '#/components/schemas/connect_embedded_account_session_create_components'
        expires_at:
          description: The timestamp at which this AccountSession will expire.
          format: unix-time
          type: integer
        livemode:
          description: If the object exists in live mode, the value is `true`. If
            the object exists in test mode, the value is `false`.
          type: boolean
        object:
          description: String representing the object's type. Objects of the same
            type share the same value.
          enum:
          - account_session
          type: string
      required:
      - account
      - client_secret
      - components
      - expires_at
      - livemode
      - object
      title: Account Session
      type: object
      x-expandableFields:
      - components
      x-resourceId: account_session
    balance_transaction:
      description: 'Balance transactions represent funds moving through your Stripe
        account.

        Stripe creates them for every type of transaction that enters or leaves your
        Stripe account balance.


        Related guide: [Balance transaction types](https://docs.stripe.com/reports/balance-transaction-types)'
      properties:
        amount:
          description: Gross amount of this transaction (in cents (or local equivalent)).
            A positive value represents funds charged to another party, and a negative
            value represents funds sent to another party.
          type: integer
        available_on:
          description: The date that the transaction's net funds become available
            in the Stripe balance.
          format: unix-time
          type: integer
        balance_type:
          description: The balance that this transaction impacts.
          enum:
          - issuing
          - payments
          - refund_and_dispute_prefunding
          - risk_reserved
          type: string
          x-stripeBypassValidation: true
        created:
          description: Time at which the object was created. Measured in seconds since
            the Unix epoch.
          format: unix-time
          type: integer
        currency:
          description: Three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html),
            in lowercase. Must be a [supported currency](https://stripe.com/docs/currencies).
          format: currency
          type: string
        description:
          description: An arbitrary string attached to the object. Often useful for
            displaying to users.
          maxLength: 5000
          nullable: true
          type: string
        exchange_rate:
          description: If applicable, this transaction uses an exchange rate. If money
            converts from currency A to currency B, then the `amount` in currency
            A, multiplied by the `exchange_rate`, equals the `amount` in currency
            B. For example, if you charge a customer 10.00 EUR, the PaymentIntent's
            `amount` is `1000` and `currency` is `eur`. If this converts to 12.34
            USD in your Stripe account, the BalanceTransaction's `amount` is `1234`,
            its `currency` is `usd`, and the `exchange_rate` is `1.234`.
          nullable: true
          type: number
        fee:
          description: Fees (in cents (or local equivalent)) paid for this transaction.
            Represented as a positive integer when assessed.
          type: integer
        fee_details:
          description: Detailed breakdown of fees (in cents (or local equivalent))
            paid for this transaction.
          items:
            $ref: '#/components/schemas/fee'
          type: array
        id:
          description: Unique identifier for the object.
          maxLength: 5000
          type: string
        net:
          description: Net impact to a Stripe balance (in cents (or local equivalent)).
            A positive value represents incrementing a Stripe balance, and a negative
            value decrementing a Stripe balance. You can calculate the net impact
            of a transaction on a balance by `amount` - `fee`
          type: integer
        object:
          description: String representing the object's type. Objects of the same
            type share the same value.
          enum:
          - balance_transaction
          type: string
        reporting_category:
          description: Learn more about how [reporting categories](https://stripe.com/docs/reports/reporting-categories)
            can help you understand balance transactions from an accounting perspective.
          maxLength: 5000
          type: string
        source:
          anyOf:
          - maxLength: 5000
            type: string
          - $ref: '#/components/schemas/application_fee'
          - $ref: '#/components/schemas/charge'
          - $ref: '#/components/schemas/connect_collection_transfer'
          - $ref: '#/components/schemas/customer_cash_balance_transaction'
          - $ref: '#/components/schemas/dispute'
          - $ref: '#/components/schemas/fee_refund'
          - $ref: '#/components/schemas/issuing.authorization'
          - $ref: '#/components/schemas/issuing.dispute'
          - $ref: '#/components/schemas/issuing.transaction'
          - $ref: '#/components/schemas/payout'
          - $ref: '#/components/schemas/refund'
          - $ref: '#/components/schemas/reserve_transaction'
          - $ref: '#/components/schemas/tax_deducted_at_source'
          - $ref: '#/components/schemas/topup'
          - $ref: '#/components/schemas/transfer'
          - $ref: '#/components/schemas/transfer_reversal'
          description: This transaction relates to the Stripe object.
          nullable: true
          x-expansionResources:
            oneOf:
            - $ref: '#/components/schemas/application_fee'
            - $ref: '#/components/schemas/charge'
            - $ref: '#/components/schemas/connect_collection_transfer'
            - $ref: '#/components/schemas/customer_cash_balance_transaction'
            - $ref: '#/components/schemas/dispute'
            - $ref: '#/components/schemas/fee_refund'
            - $ref: '#/components/schemas/issuing.authorization'
            - $ref: '#/components/schemas/issuing.dispute'
            - $ref: '#/components/schemas/issuing.transaction'
            - $ref: '#/components/schemas/payout'
            - $ref: '#/components/schemas/refund'
            - $ref: '#/components/schemas/reserve_transaction'
            - $ref: '#/components/schemas/tax_deducted_at_source'
            - $ref: '#/components/schemas/topup'
            - $ref: '#/components/schemas/transfer'
            - $ref: '#/components/schemas/transfer_reversal'
          x-stripeBypassValidation: true
        status:
          description: The transaction's net funds status in the Stripe balance, which
            are either `available` or `pending`.
          maxLength: 5000
          type: string
        type:
          description: 'Transaction type: `tax_fund`, `adjustment`, `advance`, `advance_funding`,
            `anticipation_repayment`, `application_fee`, `application_fee_refund`,
            `charge`, `climate_order_purchase`, `climate_order_refund`, `connect_collection_transfer`,
            `contribution`, `inbound_transfer`, `inbound_transfer_reversal`, `issuing_authorization_hold`,
            `issuing_authorization_release`, `issuing_dispute`, `issuing_transaction`,
            `obligation_outbound`, `obligation_reversal_inbound`, `payment`, `payment_failure_refund`,
            `payment_network_reserve_hold`, `payment_network_reserve_release`, `payment_refund`,
            `payment_reversal`, `payment_unreconciled`, `payout`, `payout_cancel`,
            `payout_failure`, `payout_minimum_balance_hold`, `payout_minimum_balance_release`,
            `refund`, `refund_failure`, `reserve_transaction`, `reserved_funds`, `reserve_hold`,
            `reserve_release`, `stripe_fee`, `stripe_fx_fee`, `stripe_balance_payment_debit`,
            `stripe_balance_payment_debit_reversal`, `tax_fee`, `topup`, `topup_reversal`,
            `transfer`, `transfer_cancel`, `transfer_failure`, `transfer_refund`,
            or `fee_credit_funding`. Learn more about [balance transaction types and
            what they represent](https://stripe.com/docs/reports/balance-transaction-types).
            To classify transactions for accounting purposes, consider `reporting_category`
            instead.'
          enum:
          - adjustment
          - advance
          - advance_funding
          - anticipation_repayment
          - application_fee
          - application_fee_refund
          - charge
          - climate_order_purchase
          - climate_order_refund
          - connect_collection_transfer
          - contribution
          - fee_credit_funding
          - inbound_transfer
          - inbound_transfer_reversal
          - issuing_authorization_hold
          - issuing_authorization_release
          - issuing_dispute
          - issuing_transaction
          - obligation_outbound
          - obligation_reversal_inbound
          - payment
          - payment_failure_refund
          - payment_network_reserve_hold
          - payment_network_reserve_release
          - payment_refund
          - payment_reversal
          - payment_unreconciled
          - payout
          - payout_cancel
          - payout_failure
          - payout_minimum_balance_hold
          - payout_minimum_balance_release
          - refund
          - refund_failure
          - reserve_hold
          - reserve_release
          - reserve_transaction
          - reserved_funds
          - stripe_balance_payment_debit
          - stripe_balance_payment_debit_reversal
          - stripe_fee
          - stripe_fx_fee
          - tax_fee
          - tax_fund
          - topup
          - topup_reversal
          - transfer
          - transfer_cancel
          - transfer_failure
          - transfer_refund
          type: string
      required:
      - amount
      - available_on
      - balance_type
      - created
      - currency
      - fee
      - fee_details
      - id
      - net
      - object
      - reporting_category
      - status
      - type
      title: Balance Transaction
      type: object
      x-expandableFields:
      - fee_details
      - source
      x-resourceId: balance_transaction
    bank_account:
      description: 'These bank accounts are payment methods on `Customer` objects.


        On the other hand [External Accounts](/api#external_accounts) are transfer

        destinations on `Account` objects for connected accounts.

        They can be bank accounts or debit cards as well, and are documented in the
        links above.


        Related guide: [Bank debits and transfers](/payments/bank-debits-transfers)'
      properties:
        account:
          anyOf:
          - maxLength: 5000
            type: string
          - $ref: '#/components/schemas/account'
          description: The account this bank account belongs to. Only applicable on
            Accounts (not customers or recipients) This property is only available
            when returned as an [External Account](/api/external_account_bank_accounts/object)
            where [controller.is_controller](/api/accounts/object#account_object-controller-is_controller)
            is `true`.
          nullable: true
          x-expansionResources:
            oneOf:
            - $ref: '#/components/schemas/account'
        account_holder_name:
          description: The name of the person or business that owns the bank account.
          maxLength: 5000
          nullable: true
          type: string
        account_holder_type:
          description: The type of entity that holds the account. This can be either
            `individual` or `company`.
          maxLength: 5000
          nullable: true
          type: string
        account_type:
          description: The bank account type. This can only be `checking` or `savings`
            in most countries. In Japan, this can only be `futsu` or `toza`.
          maxLength: 5000
          nullable: true
          type: string
        available_payout_methods:
          description: A set of available payout methods for this bank account. Only
            values from this set should be passed as the `method` when creating a
            payout.
          items:
            enum:
            - instant
            - standard
            type: string
          nullable: true
          type: array
        bank_name:
          description: Name of the bank associated with the routing number (e.g.,
            `WELLS FARGO`).
          maxLength: 5000
          nullable: true
          type: string
        country:
          description: Two-letter ISO code representing the country the bank account
            is located in.
          maxLength: 5000
          type: string
        currency:
          description: Three-letter [ISO code for the currency](https://stripe.com/docs/payouts)
            paid out to the bank account.
          format: currency
          type: string
        customer:
          anyOf:
          - maxLength: 5000
            type: string
          - $ref: '#/components/schemas/customer'
          - $ref: '#/components/schemas/deleted_customer'
          description: The ID of the customer that the bank account is associated
            with.
          nullable: true
          x-expansionResources:
            oneOf:
            - $ref: '#/components/schemas/customer'
            - $ref: '#/components/schemas/deleted_customer'
        default_for_currency:
          description: Whether this bank account is the default external account for
            its currency.
          nullable: true
          type: boolean
        fingerprint:
          description: Uniquely identifies this particular bank account. You can use
            this attribute to check whether two bank accounts are the same.
          maxLength: 5000
          nullable: true
          type: string
        future_requirements:
          anyOf:
          - $ref: '#/components/schemas/external_account_requirements'
          description: Information about the [upcoming new requirements for the bank
            account](https://docs.stripe.com/connect/custom-accounts/future-requirements),
            including what information needs to be collected, and by when.
          nullable: true
        id:
          description: Unique identifier for the object.
          maxLength: 5000
          type: string
        last4:
          description: The last four digits of the bank account number.
          maxLength: 5000
          type: string
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Set of [key-value pairs](https://docs.stripe.com/api/metadata)
            that you can attach to an object. This can be useful for storing additional
            information about the object in a structured format.
          nullable: true
          type: object
        object:
          description: String representing the object's type. Objects of the same
            type share the same value.
          enum:
          - bank_account
          type: string
        requirements:
          anyOf:
          - $ref: '#/components/schemas/external_account_requirements'
          description: Information about the requirements for the bank account, including
            what information needs to be collected.
          nullable: true
        routing_number:
          description: The routing transit number for the bank account.
          maxLength: 5000
          nullable: true
          type: string
        status:
          description: 'For bank accounts, possible values are `new`, `validated`,
            `verified`, `verification_failed`, `tokenized_account_number_deactivated`
            or `errored`. A bank account that hasn''t had any activity or validation
            performed is `new`. If Stripe can determine that the bank account exists,
            its status will be `validated`. Note that there often isn’t enough information
            to know (e.g., for smaller credit unions), and the validation is not always
            run. If customer bank account verification has succeeded, the bank account
            status will be `verified`. If the verification failed for any reason,
            such as microdeposit failure, the status will be `verification_failed`.
            If the status is `tokenized_account_number_deactivated`, the account utilizes
            a tokenized account number which has been deactivated due to expiration
            or revocation. This account will need to be reverified to continue using
            it for money movement. If a payout sent to this bank account fails, we''ll
            set the status to `errored` and will not continue to send [scheduled payouts](https://stripe.com/docs/payouts#payout-schedule)
            until the bank details are updated.


            For external accounts, possible values are `new`, `errored`, `verification_failed`,
            and `tokenized_account_number_deactivated`. If a payout fails, the status
            is set to `errored` and scheduled payouts are stopped until account details
            are updated. In the US and India, if we can''t [verify the owner of the
            bank account](https://support.stripe.com/questions/bank-account-ownership-verification),
            we''ll set the status to `verification_failed`. Other validations aren''t
            run against external accounts because they''re only used for payouts.
            This means the other statuses don''t apply.'
          maxLength: 5000
          type: string
      required:
      - country
      - currency
      - id
      - last4
      - object
      - status
      title: Bank Account
      type: object
      x-expandableFields:
      - account
      - customer
      - future_requirements
      - requirements
      x-resourceId: bank_account
    capability:
      description: 'This is an object representing a capability for a Stripe account.


        Related guide: [Account capabilities](https://docs.stripe.com/connect/account-capabilities)'
      properties:
        account:
          anyOf:
          - maxLength: 5000
            type: string
          - $ref: '#/components/schemas/account'
          description: The account for which the capability enables functionality.
          x-expansionResources:
            oneOf:
            - $ref: '#/components/schemas/account'
        future_requirements:
          $ref: '#/components/schemas/account_capability_future_requirements'
        id:
          description: The identifier for the capability.
          maxLength: 5000
          type: string
        object:
          description: String representing the object's type. Objects of the same
            type share the same value.
          enum:
          - capability
          type: string
        requested:
          description: Whether the capability has been requested.
          type: boolean
        requested_at:
          description: Time at which the capability was requested. Measured in seconds
            since the Unix epoch.
          format: unix-time
          nullable: true
          type: integer
        requirements:
          $ref: '#/components/schemas/account_capability_requirements'
        status:
          description: The status of the capability.
          enum:
          - active
          - inactive
          - pending
          - unrequested
          type: string
          x-stripeBypassValidation: true
      required:
      - account
      - id
      - object
      - requested
      - status
      title: Capability
      type: object
      x-expandableFields:
      - account
      - future_requirements
      - requirements
      x-resourceId: capability
    country_spec:
      description: 'Stripe needs to collect certain pieces of information about each
        account

        created. These requirements can differ depending on the account''s country.
        The

        Country Specs API makes these rules available to your integration.


        You can also view the information from this API call as [an online

        guide](/docs/connect/required-verification-information).'
      properties:
        default_currency:
          description: The default currency for this country. This applies to both
            payment methods and bank accounts.
          maxLength: 5000
          type: string
        id:
          description: Unique identifier for the object. Represented as the ISO country
            code for this country.
          maxLength: 5000
          type: string
        object:
          description: String representing the object's type. Objects of the same
            type share the same value.
          enum:
          - country_spec
          type: string
