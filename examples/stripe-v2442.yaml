openapi: 3.0.0
info:
  title: Stripe API
  version: 2026-08-26.dahlia
components:
  schemas:
    address_api_resource_terminal:
      description: ''
      properties:
        city:
          description: City, district, suburb, town, or village.
          maxLength: 5000
          nullable: true
          type: string
        country:
          description: Two-letter country code ([ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)).
          maxLength: 5000
          nullable: true
          type: string
        line1:
          description: Address line 1, such as the street, PO Box, or company name.
          maxLength: 5000
          nullable: true
          type: string
        line2:
          description: Address line 2, such as the apartment, suite, unit, or building.
          maxLength: 5000
          nullable: true
          type: string
        postal_code:
          description: ZIP or postal code.
          maxLength: 5000
          nullable: true
          type: string
        state:
          description: State, county, province, or region ([ISO 3166-2](https://en.wikipedia.org/wiki/ISO_3166-2)).
          maxLength: 5000
          nullable: true
          type: string
      title: AddressAPIResourceTerminal
      type: object
      x-expandableFields: []
    connect_embedded_account_session_create_components:
      description: ''
      properties:
        account_management:
