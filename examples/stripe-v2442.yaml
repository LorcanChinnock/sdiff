    event:
      description: 'Snapshot events allow you to track and react to activity in your
        Stripe integration. When

        the state of another API resource changes, Stripe creates an `Event` object
        that contains

        all the relevant information associated with that action, including the affected
        API

        resource. For example, a successful payment triggers a `charge.succeeded`
        event, which

        contains the `Charge` in the event''s data property. Some actions trigger
        multiple events.

        For example, if you create a new subscription for a customer, it triggers
        both a

        `customer.subscription.created` event and a `charge.succeeded` event.


        Configure an event destination in your account to listen for events that represent
        actions

        your integration needs to respond to. Additionally, you can retrieve an individual
        event or

        a list of events from the API.


        [Connect](https://docs.stripe.com/connect) platforms can also receive event
        notifications

        that occur in their connected accounts. These events include an account attribute
        that

        identifies the relevant connected account.


        You can access events through the [Retrieve Event API](https://docs.stripe.com/api/events#retrieve_event)

        for 30 days.'
      properties:
        account:
          description: The connected account that originates the event.
          maxLength: 5000
          type: string
        api_version:
          description: The Stripe API version used to render `data` when the event
            was created. The contents of `data` never change, so this value remains
            static regardless of the API version currently in use. This property is
            populated only for events created on or after October 31, 2014.
          maxLength: 5000
          nullable: true
          type: string
        context:
          description: Authentication context needed to fetch the event or related
            object.
          maxLength: 5000
          type: string
        created:
          description: Time at which the object was created. Measured in seconds since
            the Unix epoch.
          format: unix-time
          type: integer
        data:
          $ref: '#/components/schemas/notification_event_data'
        id:
          description: Unique identifier for the object.
          maxLength: 5000
          type: string
        livemode:
          description: If the object exists in live mode, the value is `true`. If
            the object exists in test mode, the value is `false`.
          type: boolean
        object:
          description: String representing the object's type. Objects of the same
            type share the same value.
          enum:
          - event
          type: string
        pending_webhooks:
          description: Number of webhooks that haven't been successfully delivered
            (for example, to return a 20x response) to the URLs you specify.
          type: integer
        request:
          anyOf:
          - $ref: '#/components/schemas/notification_event_request'
          description: Information on the API request that triggers the event.
          nullable: true
        type:
          description: Description of the event (for example, `invoice.created` or
            `charge.refunded`).
          maxLength: 5000
          type: string
      required:
      - created
      - data
      - id
      - livemode
      - object
      - pending_webhooks
      - type
      title: Event
      type: object
      x-expandableFields:
      - data
      - request
      x-resourceId: event
    exchange_rate:
      description: '[Deprecated] The `ExchangeRate` APIs are deprecated. Please use
        the [FX Quotes API](https://docs.stripe.com/payments/currencies/localize-prices/fx-quotes-api)
        instead.


        `ExchangeRate` objects allow you to determine the rates that Stripe is currently

        using to convert from one currency to another. Since this number is variable

        throughout the day, there are various reasons why you might want to know the
        current

        rate (for example, to dynamically price an item for a user with a default

        payment in a foreign currency).


        Please refer to our [Exchange Rates API](https://docs.stripe.com/fx-rates)
        guide for more details.


        *[Note: this integration path is supported but no longer recommended]* Additionally,

        you can guarantee that a charge is made with an exchange rate that you expect
        is

        current. To do so, you must pass in the exchange_rate to charges endpoints.
        If the

        value is no longer up to date, the charge won''t go through. Please refer
        to our

        [Using with charges](https://docs.stripe.com/exchange-rates) guide for more
        details.


        -----


        &nbsp;


        *This Exchange Rates API is a Beta Service and is subject to Stripe''s terms
        of service. You may use the API solely for the purpose of transacting on Stripe.
        For example, the API may be queried in order to:*


        - *localize prices for processing payments on Stripe*

        - *reconcile Stripe transactions*

        - *determine how much money to send to a connected account*

        - *determine app fees to charge a connected account*


        *Using this Exchange Rates API beta for any purpose other than to transact
        on Stripe is strictly prohibited and constitutes a violation of Stripe''s
        terms of service.*'
      properties:
        id:
          description: Unique identifier for the object. Represented as the three-letter
            [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html)
            in lowercase.
          maxLength: 5000
          type: string
        object:
          description: String representing the object's type. Objects of the same
            type share the same value.
          enum:
          - exchange_rate
          type: string
        rates:
          additionalProperties:
            type: number
          description: Hash where the keys are supported currencies and the values
            are the exchange rate at which the base id currency converts to the key
            currency.
          type: object
      required:
      - id
      - object
      - rates
      title: Exchange Rate
      type: object
      x-expandableFields: []
      x-resourceId: exchange_rate
